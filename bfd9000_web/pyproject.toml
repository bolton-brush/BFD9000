[project]
name = "bfd9000-web"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "box-sdk-gen[jwt]>=1.17.0",
  "cachetools>=7.1.4",
  "cryptography>=44.0,<45.0",
  "django>=6.0,<7.0",
  "django-cas-ng>=5.1.1",
  "django-cors-headers>=4.0,<5.0",
  "django-filter>=25.0,<26.0",
  "django-stubs>=6.0,<7.0",
  "djangorestframework>=3.14,<4.0",
  "dotenv>=0.9.9",
  "drf-nested-routers>=0.93,<1.0",
  "drf-spectacular>=0.27,<1.0",
  "gunicorn>=21.0,<22.0",
  "mime-enum>=0.0.3",
  "openpyxl>=3.1,<4.0",
  "pillow>=10.0,<11.0",
  "psycopg2-binary>=2.9,<3.0",
  "pydicom>=3.0,<4.0",
  "python-magic>=0.4,<1.0",
  "result>=0.17.0",
  "trimesh>=4.12.2",
  "whitenoise>=6.6,<7.0",
  "bfd9020-ai-api-client"
]

[tool.basedpyright]
extraPaths = ["."]
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
ignore = [
  "typings",
  "nix/store",
  ".direnv",
  "**/migrations",
  "**/tests",
  "**/management/commands",
  "**/management/importers"
]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.venv",
  "**/.*"
]
venvPath = "."
venv = ".venv"

[tool.django-stubs]
django_settings_module = "BFD9000.settings"

[tool.mypy]
files = ["."]
strict = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

# This ignores the management, mirations, and tests directories,
# as they are not used at runtime, we do not need such strict type checking
[[tool.mypy.overrides]]
module = "archive.management.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "archive.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "archive.tests.*"
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
include = ["BFD9000*"]

[tool.uv.sources]
bfd9020-ai-api-client = { path = ".dummy_deps/bfd9020-ai-api-client" }
