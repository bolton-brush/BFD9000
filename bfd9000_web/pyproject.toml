  "cachetools>=7.1.4",
  "cryptography>=44.0,<45.0",
  "django>=6.0,<7.0",
  "django-cas-ng>=5.1.1",
  "django-cors-headers>=4.0,<5.0",
  "django-filter>=25.0,<26.0",
  "django-stubs>=6.0,<7.0",
  "djangorestframework>=3.14,<4.0",
  "djangorestframework-stubs>=3.14,<4.0",
  "dotenv>=0.9.9",
  "drf-nested-routers>=0.93,<1.0",
  "drf-spectacular>=0.27,<1.0",
  "gunicorn>=21.0,<22.0",
  "mime-enum>=0.0.3",
  "mypy>=1.20",
  "openpyxl>=3.1,<4.0",
  "pillow>=10.0,<11.0",
  "psycopg2-binary>=2.9,<3.0",
  "pydicom>=3.0,<4.0",
