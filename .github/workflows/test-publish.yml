name: Test and Publish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR runs cancel on new commits (previous test.yml behavior);
  # deploy runs never get cancelled mid-push (previous publish-ghcr.yml behavior)
  cancel-in-progress: ${{ github.event_name != 'push' }}
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - review_requested
      - synchronize
  push:
    branches:
      - main # Triggers for staging builds
      - develop # Triggers for dev branch builds
    tags:
      - "v*" # Triggers for production releases
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  checks: read # Needed for the skip-if-already-passed API call
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/web
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check if this commit already passed tests
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PASSED=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "test" and .conclusion == "success")] | length')
          echo "Prior successful test runs on ${{ github.sha }}: $PASSED"
          echo "skip=$([ "$PASSED" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.prior.outputs.skip != 'true'
        uses: actions/checkout@v4
      - name: Install Nix
        if: steps.prior.outputs.skip != 'true'
        uses: cachix/install-nix-action@v31
      - name: Run All tests
        if: steps.prior.outputs.skip != 'true'
        run: |
          nix flake check --keep-going
  build-and-push:
    if: github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch all git tags
        run: git fetch --prune --tags
      - name: Check if this is the newest SemVer tag
        id: semver_check
        run: |
          # If not tagged, do not push to latest
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "false" ]; then
            echo "IS_NEWEST=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CURRENT_TAG="${{ github.ref_name }}"

          # Get all tags matching 'v*', strip the 'v', sort by true SemVer, grab the top one
          HIGHEST_TAG=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)
          CLEAN_CURRENT=$(echo "$CURRENT_TAG" | sed 's/^v//')

          echo "Current running tag: $CLEAN_CURRENT"
          echo "Highest repo tag found: $HIGHEST_TAG"

          if [ "$CLEAN_CURRENT" = "$HIGHEST_TAG" ]; then
            echo "Pushing latest"
            echo "IS_NEWEST=true" >> $GITHUB_OUTPUT
          else
            echo "This commit is not latest"
            echo "IS_NEWEST=false" >> $GITHUB_OUTPUT
          fi
      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Stop metadata-action from automatically injecting an implicit latest tag
          flavor: |
            latest=false
          tags: |
            # Always tag with short commit SHA
            type=sha,format=short,prefix=

            # If it's a push to main, tag it as 'staging'
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}

            # If it's a push to dev, tag it as 'dev'
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

            # If it's a v* tag, generate the exact semver version (e.g., 1.2.5)
            type=semver,pattern={{version}}

            # ONLY tag 'latest' if our check step confirmed it's the absolute newest release
            type=raw,value=latest,enable=${{ steps.semver_check.outputs.IS_NEWEST == 'true' }}
      - name: Build Docker Image with Nix
        run: |
          # This produces the bfd9000:build image, see /nix/bfd9000-docker.nix
          STREAM_SCRIPT=$(nix build .#dockerImage.passthru.stream --no-link --print-out-paths)
          "$STREAM_SCRIPT" | docker load
      - name: Tag and Push Image to Registry
        run: |
          # Read the multiline tags output generated by metadata-action
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Tagging and pushing: $tag"
            docker tag bfd9000:build "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
